baseurl: "https://xin-zhao.netlify.app/"  # please update this to your actual URL
languageCode: "en-us"
title: "Xin Zhao Website"
theme: "hugo-xmin"
googleAnalytics: ""
disqusShortname: ""
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"

permalinks:
  note: "/note/:year/:month/:day/:slug/"
  post: "/post/:year/:month/:day/:slug/"

menu:
  main:
    - name: Home
      url: ""
      weight: 1
    - name: Research
      url: "research/"
      weight: 2
    - name: Team
      url: "team/"
      weight: 3
    - name: Teaching
      url: "teaching/"
      weight: 4
    - name: CV
      url: "cv/"
      weight: 5
    - name: Publications
      url: "publications/"
      weight: 6
    - name: My Travels
      url: "travels/"
      weight: 7
    - name: My Ski
      url: "ski/"
      weight: 8
    - name: Badminton
      url: "badminton/"
      weight: 9

params:
  footer: "&copy; [Xin Zhao](https://xin-zhao.netlify.app) {Year}"

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
